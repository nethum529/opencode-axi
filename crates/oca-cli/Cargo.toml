[package]
name = "oca-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "oca"
path = "src/main.rs"

[dependencies]
oca-core = { path = "../oca-core" }
oca-opencode = { path = "../oca-opencode" }
oca-server = { path = "../oca-server" }
oca-state = { path = "../oca-state" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
url = "2"

[dev-dependencies]
oca-testkit = { path = "../oca-testkit" }
tempfile = "3.23"
