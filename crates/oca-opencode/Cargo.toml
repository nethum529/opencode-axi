[package]
name = "oca-opencode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hyper = { version = "1", default-features = false }
oca-core = { path = "../oca-core" }
# OpenCode is loopback-only. Avoid initializing and linking an unused TLS backend on
# every short-lived CLI invocation; reqwest's HTTP transport remains sufficient.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# The generated client is included by `src/generated.rs`.
progenitor-client = "0.10"
regress = "0.10"

[build-dependencies]
openapiv3 = "2"
prettyplease = "0.2"
progenitor = "0.10"
serde_json = "1"
sha2 = "0.10"
syn = "2"
toml = "0.9"

[dev-dependencies]
openapiv3 = "2"
prettyplease = "0.2"
progenitor = "0.10"
serde_json = "1"
sha2 = "0.10"
syn = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt"] }
